name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Http/Frontend/package-lock.json

      - name: Setup Takumi Guard (npm supply chain protection)
        uses: flatt-security/setup-takumi-guard-npm@v1

      - name: Install frontend dependencies
        run: npm ci
        working-directory: Http/Frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: Http/Frontend

      - name: Test frontend
        run: npm test
        working-directory: Http/Frontend

      - name: Build frontend
        run: npm run build
        working-directory: Http/Frontend

      # - name: Setup .NET
      #   uses: actions/setup-dotnet@v4
      #   with:
      #     dotnet-version: '9.0.x'

      # - name: Download Dalamud
      #   run: |
      #     wget -q https://goatcorp.github.io/dalamud-distrib/latest.zip -O dalamud.zip
      #     unzip -q dalamud.zip -d ~/dalamud

      - name: Update websiteBuild.zip
        run: |
          cd Http/Frontend && zip -r ../../websiteBuild.zip dist/ && cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin testbuild-and-public
          git checkout testbuild-and-public
          git pull origin testbuild-and-public
          git add websiteBuild.zip
          git diff --cached --quiet || git commit -m "chore: update websiteBuild.zip" && git push origin testbuild-and-public

      # - name: Build
      #   run: dotnet build -c Release -p:DalamudLibPath=$HOME/dalamud -p:IsPlogonBuild=True

      # Package the plugin output itself as the archive root. The old command
      # archived from a parent directory, producing latest/ChatAnywhere/ nesting.
      - name: Create release artifact
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/plugin-package"
          rm -rf "$package_dir"
          mkdir -p "$package_dir"
          cp -a bin/x64/Release/. "$package_dir/"
          find "$package_dir" -maxdepth 1 -type f -name '*.zip' -delete
          test -f "$package_dir/ChatAnywhereCNReborn.dll"
          test -f "$package_dir/ChatAnywhereCNReborn.json"
          (cd "$package_dir" && zip -qr "$GITHUB_WORKSPACE/latest.zip" .)
          unzip -l latest.zip
          unzip -l latest.zip | grep -E 'ChatAnywhereCNReborn\\.(dll|json)$'

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: latest.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
